<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clash Esports | اختار فرعك</title>
<meta name="description" content="Clash Esports: صالات جيمنج مفتوحة 24 ساعة في زايد و6 أكتوبر. اختار فرعك وشوف الأوض والأسعار.">
<link rel="icon" href="assets/brand/clash-logo-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="assets/brand/clash-logo.png">
<link rel="stylesheet" href="css/chooser.css">
<script>document.documentElement.classList.add('js');try{if(localStorage.getItem('clash-lang')!=='ar'){document.documentElement.lang='en';document.documentElement.dir='ltr'}}catch(e){}</script>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js" } }</script>
</head>
<body>

<header class="pick-bar">
  <p class="pick-brand" dir="ltr">CLASH <span>ESPORTS</span></p>
  <button class="lang" type="button" id="lang-toggle" lang="en" aria-label="English">EN</button>
</header>

<main class="pick">
  <h1 class="pick-title"><span data-i18n="title">اختار فرعك</span></h1>

  <!-- Zayed on the left, October on the right, in both languages -->
  <div class="branches" dir="ltr">
    <a class="branch branch-zayed" href="zayed.html" data-side="red" data-branch="zayed">
      <img src="assets/clash-hd/elite-room-3.jpg" width="1600" height="2133" alt="صالة كلاش زايد بإضاءة حمرا وزرقا ولوجو التور" data-i18n-alt="altZayed">
      <span class="branch-copy" dir="auto">
        <span class="branch-name" data-i18n="zayed">زايد</span>
        <span class="branch-line" data-i18n="zayedLine">مفتوح 24 ساعة · 7 أوض PC · بلايستيشن وسيميوليتور</span>
        <span class="branch-go"><span data-i18n="enter">ادخل الفرع</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.5"/></svg></span>
      </span>
    </a>
    <a class="branch branch-october" href="october.html" data-side="blue" data-branch="october">
      <img src="assets/october-hd/normal-room.jpg" width="1600" height="2133" alt="أوضة Normal في كلاش أكتوبر بإضاءة زرقا" data-i18n-alt="altOctober">
      <span class="branch-copy" dir="auto">
        <span class="branch-name" data-i18n="october">أكتوبر</span>
        <span class="branch-line" data-i18n="octoberLine">مفتوح 24 ساعة · 5 أوض PC · من 25 جنيه للساعة</span>
        <span class="branch-go"><span data-i18n="enter">ادخل الفرع</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.5"/></svg></span>
      </span>
    </a>
  </div>

  <!-- the logo: a real 3D object when WebGL runs, this picture otherwise -->
  <div class="logo-stage" aria-hidden="true">
    <img class="logo-flat" src="assets/brand/clash-logo-512.png" width="512" height="768" alt="">
    <canvas id="logo3d"></canvas>
  </div>
</main>

<div class="sheet" aria-hidden="true"></div>

<script type="module" src="js/chooser.js"></script>
</body>
</html>
